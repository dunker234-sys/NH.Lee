name: Secret Scan (full history)

# 전체 커밋 이력을 gitleaks로 한 번에 검사한다(수동 실행). ci.yml의 secret-scan은 PR/푸시에
# 포함된 커밋 범위만 보므로, 그 이전에 들어간 커밋은 이 워크플로로 점검한다.
# 결과는 --redact로 가려서 로그에 남기고, 발견 시 실패한다.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (전체 이력)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
