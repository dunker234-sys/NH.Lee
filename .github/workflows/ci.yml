name: CI

# STEP12: 테스트 → 빌드(+GHCR push) → 스테이징 → 승인 후 운영.
# 운영 배포는 NCP VM 1대에 SSH로 접속해 docker compose로 올린다(infra/ncp/README.md).
# 스테이징 서버는 아직 없어 deploy-staging은 자리표시자다(운영 job의 선행 조건만 충족).
# "승인 후 운영"은 GitHub Environments의 production 보호 규칙(Required
# reviewers)으로 구현하며 저장소 설정에 이미 켜 두었다.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '9.15.0'

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_password
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm build:packages

      # docs/DATA_MODEL.md가 문서화한 배포 순서(roles.sql → migrate deploy →
      # roles_post_migrate.sql → seed)를 CI에서도 그대로 따른다. attendance
      # DB뿐 아니라 e2e가 쓰는 attendance_test DB에도 동일하게 적용한다.
      - name: DB 롤 생성(roles.sql)
        run: PGPASSWORD=postgres_ci_password psql -h localhost -U postgres -f apps/api/prisma/roles.sql

      - name: attendance 마이그레이션 적용
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://migrator:migrator_dev_password@localhost:5432/attendance?schema=public
        run: npx prisma migrate deploy

      - name: attendance roles_post_migrate.sql 적용
        run: PGPASSWORD=migrator_dev_password psql -h localhost -U migrator -d attendance -v ON_ERROR_STOP=1 -f apps/api/prisma/roles_post_migrate.sql

      - name: attendance_test 생성 + 마이그레이션 + 권한
        env:
          PGPASSWORD: postgres_ci_password
        run: |
          psql -h localhost -U postgres -c "CREATE DATABASE attendance_test OWNER migrator;"
          cd apps/api
          DATABASE_URL=postgresql://migrator:migrator_dev_password@localhost:5432/attendance_test?schema=public npx prisma migrate deploy
          PGPASSWORD=migrator_dev_password psql -h localhost -U migrator -d attendance_test -v ON_ERROR_STOP=1 -f prisma/roles_post_migrate.sql

      - name: core-rules 단위테스트(커버리지 90% 임계 포함)
        run: pnpm --filter @attendance/core-rules test:coverage

      # migrate deploy는 Prisma 클라이언트를 생성하지 않는다 — 타입체크/테스트 전에 필요.
      - name: Prisma 클라이언트 생성
        run: pnpm --filter @attendance/api exec prisma generate

      - name: apps/api 타입체크
        run: pnpm --filter @attendance/api exec tsc --noEmit

      - name: apps/api 단위테스트
        run: pnpm --filter @attendance/api test

      - name: apps/api e2e 테스트
        working-directory: apps/api
        env:
          TEST_DATABASE_URL: postgresql://migrator:migrator_dev_password@localhost:5432/attendance_test?schema=public
        run: pnpm test:e2e

      - name: admin-web lint + typecheck
        run: |
          pnpm --filter @attendance/admin-web lint
          pnpm --filter @attendance/admin-web typecheck

      - name: kiosk typecheck + 단위테스트
        run: |
          pnpm --filter @attendance/kiosk typecheck
          pnpm --filter @attendance/kiosk test

      # STEP12 §A6 시크릿 관리: 하드코딩된 시크릿 회귀를 CI에서 자동 차단한다.
      - name: 시크릿 스캔
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # PR에서는 빌드 성공만 검증하고, main push에서만 GHCR에 이미지를 올린다.
  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PUSH_IMAGES: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      PUBLIC_DOMAIN: ${{ vars.PUBLIC_DOMAIN || 'localhost' }}
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: apps/api/Dockerfile
            target: runtime
          - name: api-migrate
            dockerfile: apps/api/Dockerfile
            target: migrate
          - name: admin-web
            dockerfile: apps/admin-web/Dockerfile
            target: runtime
            api_arg: NEXT_PUBLIC_API_BASE_URL
          - name: kiosk
            dockerfile: apps/kiosk/Dockerfile
            target: runtime
            api_arg: VITE_API_BASE_URL
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: GHCR 로그인
        if: env.PUSH_IMAGES == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: ${{ matrix.name }} 이미지 빌드
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: ${{ env.PUSH_IMAGES == 'true' }}
          # 브라우저 앱은 API 주소가 빌드 시점에 번들에 박힌다(api.<도메인>).
          build-args: |
            ${{ matrix.api_arg && format('{0}=https://api.{1}', matrix.api_arg, env.PUBLIC_DOMAIN) || '' }}
          tags: ghcr.io/${{ github.repository_owner }}/attendance-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy-staging:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: (placeholder) 스테이징 배포
        run: echo "스테이징 서버가 생기면 deploy-production과 같은 방식으로 이 스텝을 채운다."

  # NCP VM 1대에 SSH로 접속해 docker compose로 배포한다(infra/ncp/README.md 참고).
  deploy-production:
    needs: deploy-staging
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # "승인 후 운영": production 환경의 Required reviewers가 승인할 때까지 대기한다.
    # 아래 시크릿은 production 환경 시크릿으로 등록한다:
    #   NCP_SSH_HOST, NCP_SSH_USER, NCP_SSH_KEY(배포 전용 개인키),
    #   NCP_SSH_KNOWN_HOSTS(`ssh-keyscan -t ed25519 <host>` 결과 — 중간자 공격 방지)
    environment: production
    concurrency: deploy-production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: SSH 준비
        env:
          SSH_KEY: ${{ secrets.NCP_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.NCP_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: 배포 파일 전송
        env:
          HOST: ${{ secrets.NCP_SSH_HOST }}
          USER_: ${{ secrets.NCP_SSH_USER }}
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes"
          $SSH "$USER_@$HOST" 'mkdir -p /opt/attendance'
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            infra/ncp/docker-compose.prod.yml infra/ncp/Caddyfile infra/ncp/deploy.sh \
            apps/api/prisma/roles.sql "$USER_@$HOST:/opt/attendance/"

      - name: 배포 실행
        env:
          HOST: ${{ secrets.NCP_SSH_HOST }}
          USER_: ${{ secrets.NCP_SSH_USER }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_REPO: ghcr.io/${{ github.repository_owner }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # GITHUB_TOKEN은 이 실행 동안만 유효하다. 서버에는 저장하지 않고 stdin으로만 넘긴다.
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$USER_@$HOST" \
            "GHCR_USER='$GHCR_USER' IMAGE_REPO='$IMAGE_REPO' IMAGE_TAG='$IMAGE_TAG' bash /opt/attendance/deploy.sh"
