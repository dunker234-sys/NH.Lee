# STEP12: 키오스크는 태블릿 브라우저에서 풀스크린으로 고정 실행되는 SPA다.
# 클라이언트 라우팅을 쓰므로 알 수 없는 경로는 전부 index.html로 폴백한다.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 정적 자산은 길게 캐시하고, index.html 자체는 캐시하지 않는다
    # (배포 직후 키오스크가 이전 번들을 계속 물고 있지 않도록).
    location /index.html {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
